services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: onfacturation-app
    restart: always
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: onfacturation-nginx
    restart: always
    ports:
      - "1010:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.3
    container_name: onfacturation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Onfacturation
      MYSQL_USER: onsoft
      MYSQL_PASSWORD: 2026@onsoft
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: onfacturation-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: onsoft
      PMA_PASSWORD: 2026@onsoft
    ports:
      - "8080:80"
    depends_on:
      - db

  redis:
    image: redis:7
    container_name: onfacturation-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"

volumes:
  mysqldata:
